name: Neon Runtime Startup Gate
on:
  push:
    branches: [main]
    paths: [.github/workflows/neon-runtime-startup.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mandategate-neon-runtime
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_SHA: e91199d44d1437da151e710dbf3a77cd266ba0b9
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e91199d44d1437da151e710dbf3a77cd266ba0b9
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.9.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Verify source and local guards
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          node --test scripts/check-runtime-profile.mjs
      - run: pnpm install --frozen-lockfile
      - name: Build without remote credentials
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mandategate
          BETTER_AUTH_SECRET: synthetic-build-only-secret-at-least-32-characters
          BETTER_AUTH_URL: http://127.0.0.1:3110
          MANDATEGATE_DISABLE_PAYMENTS: "1"
        run: |
          pnpm typecheck
          pnpm build
      - name: Verify startup skips and HTTP permissions on Neon
        env:
          NEON_PREVIEW_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
          BETTER_AUTH_SECRET: ${{ secrets.NEON_BOOTSTRAP_AUTH_SECRET }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.NEON_DEMO_ADMIN_PASSWORD }}
          DEMO_AGENT_API_KEY: ${{ secrets.NEON_DEMO_INVOICE_API_KEY }}
          DEMO_PAYMENT_AGENT_API_KEY: ${{ secrets.NEON_DEMO_PAYMENT_API_KEY }}
        run: node scripts/verify-runtime-startup.mjs
      - name: Preserve sanitized evidence
        run: cat out/runtime-startup.md >> "$GITHUB_STEP_SUMMARY"
