name: Hosted Neon Three-Case Acceptance
on:
  push:
    branches: [main]
    paths: [.github/workflows/hosted-neon-demo-acceptance.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mandategate-hosted-demo-acceptance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_SHA: 66f1a22a2f70078ca17a1da5e7ff6a502fcfee31
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 66f1a22a2f70078ca17a1da5e7ff6a502fcfee31
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Confirm exact hosted candidate source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          grep -q 'export const dynamic="force-dynamic"' app/demo/page.tsx
      - name: Wait for hosted demo route from reviewed merge
        shell: bash
        run: |
          for i in $(seq 1 180); do
            code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' https://mandategate-web.onrender.com/demo || true)
            if [ "$code" = "307" ] || [ "$code" = "302" ]; then exit 0; fi
            sleep 5
          done
          echo "Hosted preview did not expose the new authenticated demo route"
          exit 1
      - name: Verify hosted login, demo outcomes and payment isolation
        env:
          DEMO_ADMIN_PASSWORD: ${{ secrets.NEON_DEMO_ADMIN_PASSWORD }}
        run: node scripts/verify-hosted-demo.mjs
