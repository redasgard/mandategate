name: Neon Preview Recovery Drill
on:
  push:
    branches: [main]
    paths: [.github/workflows/neon-preview-recovery.yml]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: mandategate-neon-recovery
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_SHA: a6e2b0139987508b3412f9d39618f794cdd1fe4d
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a6e2b0139987508b3412f9d39618f794cdd1fe4d
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.9.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Verify pinned source
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - run: pnpm install --frozen-lockfile
      - name: Test supervisor without external credentials
        run: node --test scripts/check-neon-recovery-supervisor.mjs
      - name: Typecheck and build without external credentials
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mandategate
          BETTER_AUTH_SECRET: synthetic-build-only-secret-at-least-32-characters
          BETTER_AUTH_URL: http://127.0.0.1:3109
          MANDATEGATE_DISABLE_PAYMENTS: "1"
        run: |
          pnpm typecheck
          pnpm build
      - name: Verify real Neon restart and unchanged records
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
          BETTER_AUTH_SECRET: ${{ secrets.NEON_BOOTSTRAP_AUTH_SECRET }}
          BETTER_AUTH_URL: http://127.0.0.1:3109
          MANDATEGATE_DISABLE_PAYMENTS: "1"
          PGOPTIONS: -c default_transaction_read_only=on
        run: node scripts/verify-neon-preview-recovery.mjs
      - name: Preserve evidence in job summary
        run: cat out/neon-preview-recovery.md >> "$GITHUB_STEP_SUMMARY"
