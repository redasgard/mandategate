name: Neon Demo Credential Recovery
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mandategate-neon-credentials
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
      BETTER_AUTH_SECRET: ${{ secrets.NEON_BOOTSTRAP_AUTH_SECRET }}
      DEMO_ADMIN_PASSWORD: ${{ secrets.NEON_DEMO_ADMIN_PASSWORD }}
      DEMO_AGENT_API_KEY: ${{ secrets.NEON_DEMO_INVOICE_API_KEY }}
      DEMO_PAYMENT_AGENT_API_KEY: ${{ secrets.NEON_DEMO_PAYMENT_API_KEY }}
      DEMO_ADMIN_EMAIL: admin@mandategate.local
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Validate isolated Neon credentials
        shell: bash
        run: |
          test -n "$DATABASE_URL" && test -n "$BETTER_AUTH_SECRET"
          test "${#DEMO_ADMIN_PASSWORD}" -ge 16
          test "${#DEMO_AGENT_API_KEY}" -ge 32
          test "${#DEMO_PAYMENT_AGENT_API_KEY}" -ge 32
          test "$DEMO_AGENT_API_KEY" != "$DEMO_PAYMENT_AGENT_API_KEY"
          case "$DATABASE_URL" in *neon.tech*) ;; *) echo "Refusing non-Neon target"; exit 1 ;; esac
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/recover-neon-demo-credentials.ts
