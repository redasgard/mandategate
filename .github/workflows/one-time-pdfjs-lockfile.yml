name: one-time-pdfjs-lockfile
on:
  push:
    branches: [build/slice-3-invoice-intake]
    paths:
      - ".github/workflows/one-time-pdfjs-lockfile.yml"
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - run: corepack enable
      - run: corepack prepare pnpm@12.9.1 --activate
      - name: Generate deterministic lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Publish lockfile to the isolated build branch
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile unchanged"
          else
            git commit -m "pin pdfjs-dist in pnpm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
