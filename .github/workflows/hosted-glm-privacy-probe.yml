name: Hosted GLM Privacy Probe
on:
  push:
    branches: [main]
    paths: [.github/workflows/hosted-glm-privacy-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mandategate-hosted-glm-privacy
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1342e8548c57f22f69a9638d44bafc6abdcc6c8f
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Warm Render and confirm Neon health
        shell: bash
        run: |
          for attempt in $(seq 1 4); do
            status=$(curl -sS --max-time 100 -o /tmp/glm-health -w '%{http_code}' https://mandategate-web.onrender.com/api/health || true)
            if [ "$status" = "200" ] && grep -q '"ready"' /tmp/glm-health; then
              echo 'PASS hosted health'
              exit 0
            fi
            sleep 6
          done
          echo 'GLM_HOSTED_HEALTH_UNAVAILABLE'
          exit 1
      - name: Check live GLM metadata and disabled payments
        env:
          DEMO_ADMIN_PASSWORD: ${{ secrets.NEON_DEMO_ADMIN_PASSWORD }}
        run: node scripts/verify-hosted-glm-preflight.mjs
      - name: Capture sanitized verdict
        if: always()
        shell: bash
        run: |
          if test -f out/glm-preflight.md; then
            cat out/glm-preflight.md >> "$GITHUB_STEP_SUMMARY"
          fi
